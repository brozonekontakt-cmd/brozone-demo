  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const t=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c)));
  try{sessionStorage.setItem('bz-pw',pw)}catch(_){}
  document.open();document.write(t);document.close();
}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('b'),er=document.getElementById('e');
  b.disabled=true;er.textContent='';try{await open(document.getElementById('p').value)}catch(_){er.textContent='Nieprawidłowe hasło';b.disabled=false}};
try{const s=sessionStorage.getItem('bz-pw');if(s)open(s).catch(()=>{})}catch(_){}
